<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The preview address is the owner's alone, and it has no sign-in of its
         own: without an unexpired editor token in this browser it goes to the
         live address with #eotm-renew, whose session hands a token back
         (src/lib/account.js), or asks her to sign in there. #eotm-token is that
         hand-back arriving, which the loader takes. Once a minute at most, so a
         failed hand-back cannot loop. The Amplify branch address goes to the
         preview address first, so it is gated the same way. A customer's invoice
         link (/invoice/<token>, Forms.jsx SharedInvoice) is open to anyone
         holding it. -->
    <script>
      (function (site) {
        var EDIT = 'https://preview.storyshapedstudios.com'
        var LIVE = 'https://storyshapedstudios.com'
        if (!/^preview\./.test(location.hostname)) return
        if (location.origin !== EDIT) {
          location.replace(EDIT + location.pathname + location.search + location.hash)
          return
        }
        if (/^\/invoice\//.test(location.pathname)) return
        if (/(?:^#|&)eotm-token=/.test(location.hash)) return
        var KEY = 'eotm:token:' + site
        try {
          var t = localStorage.getItem(KEY) || sessionStorage.getItem(KEY)
          if (t) {
            var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))
            if (p.site === site && p.exp * 1000 > Date.now()) return
          }
          if (Date.now() - Number(sessionStorage.getItem('sss:renewing') || 0) < 60000) return
          sessionStorage.setItem('sss:renewing', String(Date.now()))
        } catch (e) { return }
        location.replace(LIVE + location.pathname + '#eotm-renew')
      })('storyshaped')
      // The preview address is not for search engines.
      if (/^preview\./.test(location.hostname)) document.write('<meta name="robots" content="noindex, nofollow" />')
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryShaped Studios | Handmade Uranium Glass Jewelry</title>
    <meta name="description" content="Handmade uranium glass jewelry and vintage Czech uranium glass components that glow under blacklight, from StoryShaped Studios. Plus a Library of uranium glass reference." />
    <link rel="canonical" href="https://storyshapedstudios.com/" />
    <!-- AI training reservation (docs/SEO-AND-AI-VISIBILITY.md). tdm-reservation is the
         W3C TDM Reservation Protocol, the machine-readable opt-out EU law recognises;
         noai/noimageai are informal. None of them affect search indexing. -->
    <meta name="tdm-reservation" content="1" />
    <meta name="robots" content="noai, noimageai" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StoryShaped Studios" />
    <meta property="og:title" content="StoryShaped Studios | Handmade Uranium Glass Jewelry" />
    <meta property="og:description" content="Handmade uranium glass jewelry and vintage Czech uranium glass components that glow under blacklight." />
    <meta property="og:url" content="https://storyshapedstudios.com/" />
    <meta property="og:image" content="https://storyshapedstudios.com/assets/StoryShapedStudiosLogo_GmailOptimized.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "StoryShaped Studios",
        "url": "https://storyshapedstudios.com/",
        "logo": "https://storyshapedstudios.com/assets/StoryShapedStudiosLogo_GmailOptimized.png",
        "description": "Handmade uranium glass jewelry and vintage Czech uranium glass components.",
        "sameAs": [
          "https://www.etsy.com/shop/storyshapedstudios",
          "https://www.ebay.com/str/storyshapedstudios",
          "https://www.facebook.com/storyshapedstudios/",
          "https://www.instagram.com/storyshaped_studios/"
        ]
      }
    </script>
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Edge of the Map console (ADR-0007). Visitors get only this small loader;
         the editor loads for a signed-in owner via ?edit or Ctrl/Cmd+Shift+E.
         data-entry="sign-in": the site's own sign-in (src/lib/account.js) is the
         way in, not the console's admin page. -->
    <script src="https://admin.theedgeofthemap.com/loader.js" data-site="storyshaped" data-entry="sign-in" async></script>
  </body>
</html>
